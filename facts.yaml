    - "🚀 MMX fact:"


facts:

  - text: "MMX (Martian Moons eXploration) is a JAXA-led sample return mission to Phobos, the larger of Mars's two moons. The spacecraft aims to explore Phobos from orbit, land on the moon, scoop up a sample, and bring it back to Earth.
🕸️ "
    link: https://www.mmx.jaxa.jp/en/

  - text: "Phobos means 'fear' and Deimos means 'dread'. In Greek myth they were the sons of Ares, the god of war, whom the Romans called Mars."

  - text: "Both of Mars's moons were discovered in August 1877 by astronomer Asaph Hall at the US Naval Observatory in Washington."

  - text: "Phobos whips round Mars about three times in every Earth day. Seen from the Martian surface, the moon rises in the west and sets in the east."

  - text: "Phobos is only about 27 km across at its widest. That's too small for its gravity to pull it into a ball, which is why it looks like a potato. 🥔"

  - text: "Phobos's biggest crater, Stickney, is about 9 km wide, a huge dent for such a small moon. Whatever hit it came close to breaking Phobos apart."

  - text: "Phobos is slowly spiralling in towards Mars. In a few tens of millions of years it's expected to be torn apart by Mars's gravity, perhaps forming a ring. It's even possible that this has happened before!"
    link: https://mmx-news.isas.jaxa.jp/?p=1150

  - text: "Nobody knows for sure where Phobos and Deimos came from. The moons may be captured asteroids, or may have formed from debris thrown into orbit during a giant impact with Mars. MMX should help settle the issue!"

  - text: "MMX aims to bring at least 10 g of Phobos back to Earth, gathered with two samplers onboard the spacecraft. C-SMP will 'core' out a sample from 2 cm below the surface, while P-SMP (pneumatic) will collect  material using a small whirlwind of nitrogen gas."

  - text: "MMX is carrying a small rover called IDEFIX, built by the French and German space agencies CNES and DLR. It will be the first rover to drive on a moon of Mars."

  - text: "NASA's MEGANE instrument on MMX will map what Phobos is made of by measuring gamma rays and neutrons. 'Megane' is Japanese for 'eyeglasses'. 👓"

  - text: "Gravity on Phobos is less than 1/1,000 of Earth's. MMX Project Manager Kawakatsu compares landing on Mars's moon to landing a balloon: the weak gravity softens the touchdown, but a small sideways nudge can rival the downward pull & topple the spacecraft! 🎈"

  - text: "MMX won't only visit Phobos. The spacecraft also plans to make observations of Mars's smaller, more distant moon, Deimos."

  - text: "Phobos orbits only about 6,000 km above the surface of Mars, closer to its planet than any other moon in the Solar System."

  - text: "What secrets are hidden in Phobos’s rocks? 🪨 MMX’s MIRS instrument, developed by France's CNES, will examine reflected infrared light from the moon to hunt for water-bearing minerals and organic matter. What can these clues tell us about Phobos’s origins?"

  - text: "Wait… a sample of Mars?! 👀 NASA contributed MMX’s pneumatic sampler, P-SMP, to collect material from the surface of Phobos. This may include Mars grains ejected by ancient impacts and captured by Phobos. Could these fragments reveal Mars’s past? 🔴"

  - text: "A camera with a mythical namesake! 👺 MMX’s TENGOO stands for 'TElescopic Nadir imager for GeOmOrphology'—but its name evokes the tengu, a Japanese folklore creature with a red face and long nose. TENGOO will snap detailed images of Phobos's terrain!"

  - text: "🐍 A mythical beast heads to Phobos! MMX’s OROCHI camera ('Optical RadiOmeter composed of CHromatic Imagers') shares its name with Japan’s legendary eight-headed serpent. The link? OROCHI has eight wavelength channels to identify minerals on Phobos."

  - text: "Rings of Mars 🪐? The Circum-Martian Dust Monitor (CMDM) onboard MMX will search for proposed (but still undiscovered) dust rings around Mars."

  - text: "Protecting future Martians 👩‍🚀 The Interplanetary Radiation Environment Monitor (IREM) onboard MMX will measure the space radiation environment, helping evaluate the exposure dose for a human crew that may one day visit the Martian system!"

  - text: "🧊 Does Phobos have an icy heart? MMX’s Mass Spectrum Analyzer (MSA) will study charged particles around the moons, searching for clues to hidden ice. If Phobos contains ice deep inside, it could hint that this little moon began life as a captured asteroid!"

  - text: "The greatest journey yet to be told 📸 MMX will carry two Super Hi-Vision (SHV) cameras, developed with NHK (Japan Broadcasting Corporation), to capture Phobos, Deimos and Mars itself in breathtaking 8K and 4K resolution."

  - text: "🚀 MMX launched aboard Japan’s H3 rocket in its most powerful 24L configuration, with 2 first-stage engines, 4 solid rocket boosters and a 'L'ong fairing! Lift-of was on October 20 at 04:41:03 JST from Tanegashima Space Center."

  - text: "A heist, you say? 🕵️‍♀️🚀 Japan’s MMX mission plans to grab a piece of Mars’s mysterious moon Phobos and bring it back to Earth! But what secrets might these spoils reveal? Science Magazine explores the audacious mission! 👇"
    link: https://www.science.org/content/article/audacious-space-heist-japan-aims-bring-home-bits-martian-moon
  
  - text: "🚀 MMX was the first exploration mission into interplanetary space launched by JAXA's latest launch vehicle, the H3! Lift-off was on October 20, 2026 at 04:41:03 JST from Tanegashima Space Center."
  
  - text: "Ready to try being a JAXA engineer? This web based game let's you build your own MMX spacecraft to explore the moons of Mars! What would you have onboard? 🎮"
    link: https://edu.jaxa.jp/en/contents/MMX/

  - text: "Would you like your very own Martian Moons eXploration spacecraft? These instructions let you print your own 1:48-scale model of MMX, ready to head to a potato near you!"
    image: images/3dmmx3-1.png
    alt: "3D printed version of the MMX spacecraft in an orange material. A toy car sits beside it for scale."
    link: https://mmx-news.isas.jaxa.jp/?p=2410
    
  - text: "A partial eclipse of the heart? 🧡 Phobos isn't large enough to create a total eclipse from the surface of Mars. But NASA's Perseverance rover did capture this potato-shaped shadow! (📸: NASA/JPL-Caltech/ASU/MSSS/SSI)"
    image: images/phobos_eclipse.jpeg
    alt: "Photograph of Phobos crossing the surface of the Sun, captured by the Mastcam-Z camera system onboard Perseverance. The Sun is an orange disc, and Phobos is a black potato-shape."

  - text: "The Idefix rover will be the first to explore the surface of Phobos. But the actual samples will be collected by the MMX spacecraft itself, which is equipped with two sampling mechanisms! Data about the surface from Idefix will help MMX make a safe landing."

  - text: "A moon of darkness? 🌚 Phobos is one of the darkest bodies in the Solar System, reflecting less than 7% sunlight. Our Moon reflects about twice as much light, although asteroid Ryugu (destination of the Hayabusa2 mission) is even darker than Phobos!"

  - text: "Can't hold me down! 🎈The Idefix rover was designed by DLR (Germany) and CNES (France) space agencies, the same duo responsible for the Philae lander on Comet 67P and the MASCOT lander on asteroid Ryugu. That's some serious low-gravity landing experience!"

  - text: "We've tried to visit Phobos before... and failed. The Soviet Union's Phobos 2 mission lost contact while approaching the moon, while Russia's Phobos-Grunt sample return mission never left Earth orbit. With the MMX mission, it is time to try again..."

  - text: "MMX's Idefix rover must drive at just 1 mm/s to avoid tipping in Phobos's very weak gravity! The escape speed on Phobos is just 11.4 m/s, the sprint speed of an elephant 🐘 More incredible facts can be found in the rover press kit: "
    link: https://www.dlr.de/en/media/publications/miscellaneous/idefix_launch_kit_en_links.pdf/@@download/file

  

  



